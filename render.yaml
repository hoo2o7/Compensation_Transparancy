services:
  - type: web
    name: compensation-transparency-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      # Comma-separated list of allowed browser origins (besides *.vercel.app,
      # which is always allowed). Add your custom domain here if you have one.
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
